13,"2026-05-24":211,"2026-05-25":184,"2026-05-26":203,"2026-05-27":17,"2026-05-28":251,"2026-05-29":195,"2026-05-30":181,"2026-05-31":162,"2026-06-01":231,"2026-06-02":228,"2026-06-03":22,"2026-06-04":210,"2026-06-05":255,"2026-06-06":232,"2026-06-07":197,"2026-06-08":207,"2026-06-09":213,"2026-06-10":25,"2026-06-11":224,"2026-06-12":217,"2026-06-13":202,"2026-06-14":202,"2026-06-15":182,"2026-06-16":172,"2026-06-17":11,"2026-06-18":228,"2026-06-19":200,"2026-06-20":208,"2026-06-21":156,"2026-06-22":226,"2026-06-23":217,"2026-06-24":210,"2026-06-25":190};
const INIT_COLLECTION={"1":400000,"2":570000,"3":440000,"4":300000,"5":70200,"6":0};

function pad(n){return String(n).padStart(2,'0');}
function fmt(n){return Math.round(n||0).toLocaleString('ko-KR');}
function dateKey(year,month,day){return `${year}-${pad(month)}-${pad(day)}`;}
function keyToDate(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d);}
function toDateKey(dt){return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;}
function addDate(dt,days){const out=new Date(dt);out.setDate(out.getDate()+days);return out;}
function defaultFeesForYear(year){return {...(year===2026?DEFAULT_FEES_2026:DEFAULT_COUPANG_FEES)};}
function periodStoreKey(year,month){return `${year}-${pad(month)}`;}

function makeInitialData(){
  const collectionByPeriod={};
  Object.entries(INIT_COLLECTION).forEach(([m,v])=>collectionByPeriod[periodStoreKey(2026,Number(m))]=Number(v)||0);
  return {
    dataVersion:4,
    deliveries:{...INIT_DELIVERIES},
    collectionByPeriod,
    expenses:{},
    feesByYear:{"2026":{...DEFAULT_FEES_2026}},
    offDays:{},
    taxRates:{vat:10,income:6}
  };
}
function migrateData(raw){
  const d=raw&&typeof raw==='object'?raw:makeInitialData();
  if(!d.deliveries) d.deliveries={...INIT_DELIVERIES};
  if(!d.expenses) d.expenses={};
  if(!d.taxRates) d.taxRates={vat:10,income:6};
  if(!d.collectionByPeriod) d.collectionByPeriod={};
  // 이전 파일의 월별 집하매출(1,2,3...)은 2026년 데이터로 옮김.
  if(d.collection&&typeof d.collection==='object'){
    Object.entries(d.collection).forEach(([m,v])=>{
      if(/^\d{1,2}$/.test(m)){
        const key=periodStoreKey(2026,Number(m));
        if(d.collectionByPeriod[key]===undefined)d.collectionByPeriod[key]=Number(v)||0;
      }
    });
  }
  if(!d.feesByYear) d.feesByYear={};
  if(!d.feesByYear['2026']){
    const oldFees=(d.fees&&typeof d.fees==='object')?d.fees:{};
    d.feesByYear['2026']={...DEFAULT_FEES_2026,...oldFees};
  }
  if(!d.offDays) d.offDays={};
  // 이전 파일의 휴무 설정(월 번호 키)도 2026년 정산월로 보존.
  Object.keys(d.offDays).forEach(k=>{
    if(/^\d{1,2}$/.test(k)){
      const nk=periodStoreKey(2026,Number(k));
      if(!Array.isArray(d.offDays[nk])) d.offDays[nk]=Array.isArray(d.offDays[k])?[...d.offDays[k]]:[];
    }
  });
  d.dataVersion=4;
  return d;
}
function loadData(){
  let loaded=null;
  try{
    // v3 우선 로드, 없으면 v2에서 마이그레이션
    loaded=JSON.parse(localStorage.getItem('coupang_v3')||'null');
    if(!loaded){
      const old=JSON.parse(localStorage.getItem('coupang_v2')||'null');
      if(old) loaded=old;
    }
  }catch(e){}
  const data=migrateData(loaded||makeInitialData());
  localStorage.setItem('coupang_v3',JSON.stringify(data));
  return data;
}
function save(){localStorage.setItem('coupang_v3',JSON.stringify(DATA));}
let DATA=loadData();
let curYear=new Date().getFullYear();
if(curYear<MIN_YEAR||curYear>MAX_YEAR)curYear=MIN_YEAR;
let curMonth=new Date().getMonth()+1;
let curTab='delivery';
let editCell=null;
let offdayPanelOpen=false;

function getYearFees(year=curYear){
  const key=String(year);
  if(!DATA.feesByYear[key])DATA.feesByYear[key]=defaultFeesForYear(year);
  return DATA.feesByYear[key];
}
function getFee(m,year=curYear){return Number(getYearFees(year)[String(m)] ?? defaultFeesForYear(year)[m]);}
function isLotte(m,year=curYear){return year===2026&&m<=4;}
function collectionKey(m=curMonth,year=curYear){return periodStoreKey(year,m);}
function getCollection(m=curMonth,year=curYear){return Number(DATA.collectionByPeriod[collectionKey(m,year)]||0);}
function offMonthKey(m=curMonth,year=curYear){return periodStoreKey(year,m);}
function getOffDays(m=curMonth,year=curYear){const key=offMonthKey(m,year);return Array.isArray(DATA.offDays[key])?DATA.offDays[key]:[];}
function isOffDay(m,key,year=curYear){return getOffDays(m,year).includes(key);}

function settlementInfo(m,year=curYear){
  // 2026년 5월은 쿠팡 첫 정산이라 5/1~5/25. 이후 쿠팡 정산은 전월 26일~당월 25일.
  if(year===2026&&m===5)return {label:'2026년 5월 첫 정산',range:'5/1 ~ 5/25',start:new Date(2026,4,1),end:new Date(2026,4,25)};
  if(year===2026&&m<5)return {label:`2026년 ${m}월`,range:`${m}/1 ~ ${m}/${new Date(year,m,0).getDate()}`,start:new Date(year,m-1,1),end:new Date(year,m,0)};
  const start=new Date(year,m-2,26);
  const end=new Date(year,m-1,25);
  return {label:`${year}년 ${m}월 정산`,range:`${start.getMonth()+1}/${start.getDate()} ~ ${m}/25`,start,end};
}
function periodKeys(m=curMonth,year=curYear){
  const {start,end}=settlementInfo(m,year),out=[];
  const cursor=new Date(start);
  while(cursor<=end){out.push(toDateKey(cursor));cursor.setDate(cursor.getDate()+1);}
  return out;
}

// 법정공휴일은 자동으로 빨간 태그만 표시한다. 쿠팡 근무 여부/배송 건수는 자동 변경하지 않는다.
function buildLegalHolidayMap(year){
  if(HOLIDAY_CACHE[year])return HOLIDAY_CACHE[year];
  const map={}, groups=[];
  const add=(key,name,short,group)=>{
    if(!map[key])map[key]=[];
    map[key].push({name,short,group});
  };
  const addGroup=(id,name,items,rule)=>{
    groups.push({id,name,items:items.map(x=>x.key),rule});
    items.forEach(x=>add(x.key,x.name||name,x.short||name,id));
  };
  const fixed=(month,day)=>dateKey(year,month,day);
  addGroup('newyear','신정',[{key:fixed(1,1),short:'신정'}],'none');
  addGroup('march1','3·1절',[{key:fixed(3,1),short:'3·1'}],'weekendOrOverlap');
  addGroup('labor','근로자의 날',[{key:fixed(5,1),short:'근로'}],'weekendOrOverlap');
  addGroup('children','어린이날',[{key:fixed(5,5),short:'어린이'}],'weekendOrOverlap');
  addGroup('memorial','현충일',[{key:fixed(6,6),short:'현충일'}],'none');
  addGroup('constitution','제헌절',[{key:fixed(7,17),short:'제헌절'}],'weekendOrOverlap');
  addGroup('liberation','광복절',[{key:fixed(8,15),short:'광복절'}],'weekendOrOverlap');
  addGroup('foundation','개천절',[{key:fixed(10,3),short:'개천절'}],'weekendOrOverlap');
  addGroup('hangul','한글날',[{key:fixed(10,9),short:'한글날'}],'weekendOrOverlap');
  addGroup('christmas','성탄절',[{key:fixed(12,25),short:'성탄절'}],'weekendOrOverlap');
  const lunar=LUNAR_HOLIDAYS[year];
  if(lunar){
    const seol=keyToDate(lunar.seollal), buddha=keyToDate(lunar.buddha), chuseok=keyToDate(lunar.chuseok);
    addGroup('seollal','설날',[
      {key:toDateKey(addDate(seol,-1)),name:'설날 연휴',short:'설날'},
      {key:toDateKey(seol),name:'설날',short:'설날'},
      {key:toDateKey(addDate(seol,1)),name:'설날 연휴',short:'설날'}
    ],'sundayOrOverlap');
    addGroup('buddha','부처님오신날',[{key:toDateKey(buddha),short:'석가탄신'}],'weekendOrOverlap');
    addGroup('chuseok','추석',[
      {key:toDateKey(addDate(chuseok,-1)),name:'추석 연휴',short:'추석'},
      {key:toDateKey(chuseok),name:'추석',short:'추석'},
      {key:toDateKey(addDate(chuseok,1)),name:'추석 연휴',short:'추석'}
    ],'sundayOrOverlap');
  }
  Object.entries(SPECIAL_HOLIDAYS).forEach(([key,info])=>{if(key.startsWith(String(year)+'-'))add(key,info.name,info.short,'special');});
  const weekday=key=>keyToDate(key).getDay();
  const overlaps=(group)=>group.items.some(key=>(map[key]||[]).some(item=>item.group!==group.id));
  const triggers=(group)=>{
    if(group.rule==='none')return false;
    if(group.rule==='weekendOrOverlap')return group.items.some(key=>[0,6].includes(weekday(key)))||overlaps(group);
    if(group.rule==='sundayOrOverlap')return group.items.some(key=>weekday(key)===0)||overlaps(group);
    return false;
  };
  const usedSubs=new Set();
  groups.sort((a,b)=>Math.max(...a.items.map(k=>keyToDate(k).getTime()))-Math.max(...b.items.map(k=>keyToDate(k).getTime()))).forEach(group=>{
    if(!triggers(group))return;
    const last=group.items.map(keyToDate).sort((a,b)=>b-a)[0];
    let candidate=addDate(last,1);
    // 대체공휴일이 토요일이면 다음 첫 번째 비공휴일을 쓰도록 토·일과 기존 공휴일을 건너뜀.
    while(map[toDateKey(candidate)]||usedSubs.has(toDateKey(candidate))||candidate.getDay()===0||candidate.getDay()===6)candidate=addDate(candidate,1);
    const key=toDateKey(candidate);
    add(key,`${group.name} 대체공휴일`,'대체','sub-'+group.id);
    usedSubs.add(key);
  });
  HOLIDAY_CACHE[year]=map;
  return map;
}
function getLegalHoliday(key){
  const year=Number(key.slice(0,4));
  return buildLegalHolidayMap(year)[key]||[];
}
function legalHolidayName(key){return [...new Set(getLegalHoliday(key).map(x=>x.name))].join(' · ');}
function legalHolidayShort(key){
  const names=[...new Set(getLegalHoliday(key).map(x=>x.short))];
  return names.length>1?'공휴일':(names[0]||'');
}
function legalHolidayEntries(year=curYear){
  return Object.entries(buildLegalHolidayMap(year)).filter(([key])=>key.startsWith(String(year)+'-')).sort((a,b)=>a[0].localeCompare(b[0]));
}

function mStats(m=curMonth,year=curYear){
  const fee=getFee(m,year);
  let total=0,work=0;
  periodKeys(m,year).forEach(key=>{const v=Number(DATA.deliveries[key]||0);if(v>0){total+=v;work++;}});
  const col=getCollection(m,year);
  return{total,work,revenue:total*fee+col,col,avg:work?Math.round(total/work):0,fee,offDays:getOffDays(m,year).length};
}
function mExp(m=curMonth,year=curYear){
  let tot=0;const bc={};
  periodKeys(m,year).forEach(key=>{(DATA.expenses[key]||[]).forEach(e=>{tot+=Number(e.amount)||0;bc[e.cat]=(bc[e.cat]||0)+(Number(e.amount)||0);});});
  return{total:tot,bycat:bc};
}

function renderCal(){
  const fee=getFee(curMonth,curYear),info=settlementInfo(curMonth,curYear);
  const dates=[];
  const cursor=new Date(info.start);
  while(cursor<=info.end){dates.push(new Date(cursor));cursor.setDate(cursor.getDate()+1);}
  const first=info.start.getDay();
  const cells=[...Array(first).fill(null),...dates];
  while(cells.length%7)cells.push(null);
  const heads=['일','월','화','수','목','금','토'].map((h,i)=>`<th style="color:${i===0?'#ff6b6b':i===6?'#74b9ff':'#a0a0c0'}">${h}</th>`).join('');
  let rows='';
  for(let i=0;i<cells.length;i+=7){
    rows+='<tr>'+cells.slice(i,i+7).map(dt=>{
      if(!dt)return'<td style="background:#f9fbfd;border:1px solid #edf1f5"></td>';
      const m=dt.getMonth()+1,d=dt.getDate(),key=toDateKey(dt);
      const val=Number(DATA.deliveries[key]||0);
      const legal=getLegalHoliday(key);
      const sun=dt.getDay()===0;
      const sat=dt.getDay()===6&&!sun;
      const off=isOffDay(curMonth,key,curYear);
      const classes=[off?'td-off':'',legal.length?'td-legal':'',sun?'td-sun':sat?'td-sat':'td-nor'].filter(Boolean).join(' ');
      const dc=legal.length?'#d85f7e':sun?'#ff6b6b':sat?'#74b9ff':'#6666aa';
      const rev=val?`<div class="drev">${fmt(val*fee)}</div>`:'';
      const ea=(DATA.expenses[key]||[]).reduce((a,e)=>a+(Number(e.amount)||0),0);
      const ed=ea?`<div class="dexp">-${fmt(ea)}</div>`:'';
      const tag=(legal.length||off)?`<div class="tag-row">${legal.length?`<span class="legal-tag" title="${legalHolidayName(key)}">${legalHolidayShort(key)}</span>`:''}${off?`<span class="offday-tag">휴무</span>`:''}</div>`:'';
      const isEdit=editCell===key;
      const cell=isEdit?`<input class="dinp" id="inp_${key}" type="number" value="${val||''}" onblur="saveCell('${key}',this.value)" onkeydown="if(event.key==='Enter')saveCell('${key}',this.value)">`:`<div class="dval ${val?'has':'no'}" onclick="startEdit('${key}')">${val||'·'}</div>`;
      const label=(d===1||d===26)?`${m}/${d}`:d;
      return`<td class="${classes}"><div class="dnum" style="color:${dc}">${label}</div>${tag}${cell}${rev}${ed}</td>`;
    }).join('')+'</tr>';
  }
  return`<table class="cal"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
}
function renderOffDayChips(){
  const list=getOffDays(curMonth,curYear).slice().sort();
  if(!list.length)return '<span class="off-empty">지정된 휴무일 없음</span>';
  return list.map(key=>{const dt=keyToDate(key);return `<span class="offday-chip">${dt.getMonth()+1}/${dt.getDate()} <button onclick="removeOffDay('${key}')">×</button></span>`;}).join('');
}
function toggleOffDayPanel(){offdayPanelOpen=!offdayPanelOpen;renderContent();}
function addOffDay(){
  const el=document.getElementById('offDate'),key=el&&el.value;
  if(!key)return;
  const info=settlementInfo(curMonth,curYear);
  if(key<toDateKey(info.start)||key>toDateKey(info.end)){alert('현재 정산기간 안의 날짜만 지정할 수 있어.');return;}
  const list=getOffDays(curMonth,curYear),store=offMonthKey(curMonth,curYear);
  if(!list.includes(key))DATA.offDays[store]=[...list,key];
  save();renderContent();
}
function removeOffDay(key){
  DATA.offDays[offMonthKey(curMonth,curYear)]=getOffDays(curMonth,curYear).filter(v=>v!==key);
  save();renderContent();
}

  ${bcat?`<div class="card"><div class="clabel">📊 분류별 지출 집계</div>${bcat}</div>`:''}
  <div class="card"><div class="clabel">📋 지출 내역</div>${items.length?items.join(''):'<div class="empty">지출 내역이 없습니다</div>'}</div>
  <div style="font-size:10px;color:#8c98a8;line-height:1.5;padding:0 4px">※ 엑셀과 동일하게 부가세와 종소세는 월 매출 기준 단순 적립액이야. 실제 신고 시 매입세액·공제 등에 따라 달라질 수 있어.</div>`;
}

// ── 통계 탭 ──
function taxAccrualSummary(year=curYear){
  const vatRate=Number(DATA.taxRates?.vat ?? 10);
  const incomeRate=Number(DATA.taxRates?.income ?? 6);
  const monthly=MONTHS.map((_,i)=>{
    const month=i+1,revenue=mStats(month,year).revenue;
    return{month,revenue,vat:Math.round(revenue*vatRate/100),income:Math.round(revenue*incomeRate/100)};
  });
  const sum=(arr,key)=>arr.reduce((total,item)=>total+(item[key]||0),0);
  const firstTerm=monthly.filter(item=>item.month<=6),secondTerm=monthly.filter(item=>item.month>=7);
  return{vatRate,incomeRate,vatFirst:sum(firstTerm,'vat'),vatSecond:sum(secondTerm,'vat'),incomeYear:sum(monthly,'income'),totalTax:sum(monthly,'vat')+sum(monthly,'income'),firstRevenue:sum(firstTerm,'revenue'),secondRevenue:sum(secondTerm,'revenue')};
}
function renderStats(){
  const all=MONTHS.map((_,i)=>{const m=i+1,s=mStats(m,curYear),e=mExp(m,curYear);return{...s,month:m,exp:e.total};});
  const yt=all.reduce((a,s)=>a+s.total,0),yr=all.reduce((a,s)=>a+s.revenue,0);
  const maxR=Math.max(...all.map(s=>s.revenue),1),tax=taxAccrualSummary(curYear);
  const bars=all.map(s=>`<div class="brow"><span class="bmonth">${s.month}월</span><div class="bbg"><div class="bfill" style="width:${(s.revenue/maxR*100).toFixed(1)}%;background:${s.month===curMonth?'#2f80ed':s.revenue>0?'#7eb8f7':'#d8e4ef'}"></div></div><span class="bval" style="color:${s.month===curMonth?'#2f80ed':'#748096'};font-weight:${s.month===curMonth?900:700}">${s.revenue?fmt(s.revenue/10000)+'만':'−'}</span></div>`).join('');
  const rows=all.map(s=>`<tr class="${s.month===curMonth?'arow':''}" onclick="setMonthAndTab(${s.month})" style="cursor:pointer"><td>${s.month}월</td><td style="color:${s.total?'#1976d2':'#aab6c4'};font-weight:700">${s.total?fmt(s.total):'-'}</td><td style="color:${s.revenue?'#15966d':'#aab6c4'}">${s.revenue?fmt(s.revenue):'-'}</td><td style="color:#748096">${s.work||'-'}</td><td style="color:#748096">${s.avg||'-'}</td></tr>`).join('');
  return`
  <div class="sgrid">
    <div class="scard"><div class="slabel">📦 ${curYear}년 누적 배송</div><div class="sval">${fmt(yt)} 건</div></div>
    <div class="scard"><div class="slabel">💰 ${curYear}년 누적 매출</div><div class="sval" style="color:#15966d">${fmt(yr)} 원</div></div>
  </div>
  <div class="card">
    <div class="clabel">🧾 ${curYear}년 세금 적립 누계</div>
    <div class="tax-grid">
      <div class="tax-card"><div class="tax-label">부가세 1기 · 1~6월</div><div class="tax-amount" style="color:#e07f3d">${fmt(tax.vatFirst)}원</div><div class="tax-sub">정산월 매출 ${fmt(tax.firstRevenue)}원 × ${tax.vatRate}%</div></div>
      <div class="tax-card"><div class="tax-label">부가세 2기 · 7~12월</div><div class="tax-amount" style="color:#e07f3d">${fmt(tax.vatSecond)}원</div><div class="tax-sub">정산월 매출 ${fmt(tax.secondRevenue)}원 × ${tax.vatRate}%</div></div>
      <div class="tax-card full"><div class="tax-label">${curYear}년 종합소득세 적립 누계</div><div class="tax-amount" style="color:#8e62d9">${fmt(tax.incomeYear)}원</div><div class="tax-sub">연간 정산월 매출 ${fmt(yr)}원 × ${tax.incomeRate}% · 세금 적립 합계 ${fmt(tax.totalTax)}원</div></div>
    </div>
    <div class="tax-note">※ 정산월 매출에 부가세·종소세 적립률을 적용한 준비금이야. 실제 납부액은 매입세액, 필요경비, 공제 등에 따라 달라질 수 있어.</div>
  </div>
  <div class="card"><div class="clabel">📊 정산월별 매출 차트 (쿠팡은 전월 26일~당월 25일)</div>${bars}</div>
  <div class="card"><div class="clabel">📋 정산월별 상세 (터치 → 해당 월로)</div><div style="overflow-x:auto"><table class="stbl"><thead><tr><th>월</th><th>건수</th><th>매출</th><th>근무일</th><th>일평균</th></tr></thead><tbody>${rows}<tr class="trow"><td>합계</td><td style="color:#1976d2">${fmt(yt)}</td><td style="color:#15966d">${fmt(yr)}</td><td></td><td></td></tr></tbody></table></div></div>`;
}

// ── 설정 탭 ──
function renderSettings(){
  const feeRows=MONTHS.map((m,i)=>{
    const mn=i+1,fee=getFee(mn,curYear),lotte=isLotte(mn,curYear);
    return`<div class="fee-row"><span class="fee-label">${m} ${lotte?'🟡':'🔵'}</span><input class="fee-inp" type="number" value="${fee}" onchange="setFee(${mn},this.value)" style="color:${lotte?'#b77c00':'#1976d2'};font-weight:700"><span class="fee-unit">원/건</span></div>`;
  }).join('');
  const holidays=legalHolidayEntries(curYear).map(([key,items])=>{const dt=keyToDate(key);return `<span class="holiday-chip">${dt.getMonth()+1}/${dt.getDate()} ${legalHolidayShort(key)}</span>`;}).join('');
  return`
  <div class="card">
    <div class="clabel">⚙️ ${curYear}년 월별 건당 수수료 설정</div>
    <div style="font-size:11px;color:#667a91;margin-bottom:10px">${curYear===2026?'🟡 1~4월 롯데택배 · 🔵 5월부터 쿠팡':'🔵 쿠팡 정산 기준 · 수수료는 연도별로 따로 저장돼.'}</div>
    ${feeRows}
  </div>
  <div class="card">
    <div class="clabel">📋 세금 적립률 설정</div>
    <div style="font-size:11px;color:#667a91;margin-bottom:10px">가계부와 통계의 예상 실수령액 계산에 적용돼. 기본값은 부가세 10%, 종소세 6%야.</div>
    <div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><div class="fee-label" style="width:auto;margin-bottom:5px">부가세</div><div style="display:flex;align-items:center;gap:6px"><input class="rate-input" type="number" min="0" max="100" value="${DATA.taxRates?.vat ?? 10}" onchange="setTaxRate('vat',this.value)"><span class="fee-unit">%</span></div></div><div style="flex:1"><div class="fee-label" style="width:auto;margin-bottom:5px">종소세</div><div style="display:flex;align-items:center;gap:6px"><input class="rate-input" type="number" min="0" max="100" value="${DATA.taxRates?.income ?? 6}" onchange="setTaxRate('income',this.value)"><span class="fee-unit">%</span></div></div></div>
  </div>
  <div class="card">
    <div class="clabel">📅 ${curYear}년 법정공휴일 자동 표시</div>
    <div style="font-size:11px;color:#667a91;line-height:1.5">달력에 빨간 태그로 자동 표시돼. 실제 쿠팡 근무 여부나 개인 휴무는 자동 변경되지 않아.</div>
    <details class="holiday-details"><summary>${curYear}년 공휴일 ${legalHolidayEntries(curYear).length}일 확인</summary><div class="holiday-list">${holidays}</div></details>
  </div>
  <div class="card">
    <div class="clabel">⚠️ 데이터 초기화</div>
    <div style="font-size:12px;color:#667a91;margin-bottom:10px">엑셀 원본 데이터로 되돌립니다. 이후 연도에 직접 입력한 내용도 함께 삭제돼.</div>
    <button onclick="resetData()" style="background:#fff2f3;border:1px solid #f0c8d1;border-radius:10px;color:#d8526b;font-weight:800;font-size:13px;padding:10px 18px;cursor:pointer;width:100%">초기화 (엑셀 데이터로 복원)</button>
  </div>`;
}

// ── 이벤트 함수 ──
function startEdit(key){
  editCell=key;renderContent();
  setTimeout(()=>{const inp=document.getElementById(`inp_${key}`);if(inp){inp.focus();inp.select();}},50);
}
function saveCell(key,val){
  const n=parseInt(val)||0;
  if(n)DATA.deliveries[key]=n;else delete DATA.deliveries[key];
  save();editCell=null;renderContent();
}
function setCol(val){
  const amount=Math.max(0,parseFloat(String(val).replace(/,/g,''))||0);
  DATA.collectionByPeriod[collectionKey(curMonth,curYear)]=amount;
  save();
  // 매출 카드만 즉시 업데이트
  const s=mStats(curMonth,curYear);
  const totalEl=document.getElementById('monthRevenueValue');
  if(totalEl) totalEl.textContent=fmt(s.revenue)+' 원';
}
function addExp(){
  const date=document.getElementById('eDate').value,cat=document.getElementById('eCat').value,desc=document.getElementById('eDesc').value,amount=parseFloat(document.getElementById('eAmt').value);
  if(!date||!amount){alert('날짜와 금액을 입력해주세요');return;}
  if(!DATA.expenses[date])DATA.expenses[date]=[];
  DATA.expenses[date].push({cat,desc,amount});save();renderContent();
}
function removeExp(key,idx){
  if(!confirm('삭제할까요?'))return;
  DATA.expenses[key].splice(idx,1);if(!DATA.expenses[key].length)delete DATA.expenses[key];save();renderContent();
}
function setFee(m,val){getYearFees(curYear)[String(m)]=parseInt(val)||defaultFeesForYear(curYear)[m];save();}
function setTaxRate(type,val){if(!DATA.taxRates)DATA.taxRates={vat:10,income:6};DATA.taxRates[type]=Math.max(0,Math.min(100,parseFloat(val)||0));save();}
function setMonthAndTab(m){
  curMonth=m;curTab='delivery';editCell=null;offdayPanelOpen=false;
  document.querySelectorAll('.tbtn').forEach((b,i)=>b.classList.toggle('on',i===0));
  renderMonths();renderHeader();renderContent();
}
function resetData(){
  if(!confirm('정말 초기화하시겠어요? 2026년 엑셀 원본 외에 직접 입력한 내용이 모두 삭제됩니다.'))return;
  DATA=makeInitialData();save();renderYears();renderMonths();renderHeader();renderContent();
}

// 초기화
renderYears();renderMonths();renderHeader();renderContent();

// ── PWA 설치 ──
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  showInstallBanner();
});
function showInstallBanner(){
  if(document.getElementById('installBanner'))return;
  const banner=document.createElement('div');
  banner.id='installBanner';
  banner.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2f80ed;color:#fff;border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(47,128,237,.4);z-index:9999;font-size:13px;font-weight:800;white-space:nowrap';
  banner.innerHTML='🚚 앱으로 설치하기 <button onclick="installPWA()" style="background:#fff;color:#2f80ed;border:none;border-radius:8px;padding:6px 14px;font-weight:900;font-size:13px;cursor:pointer">설치</button><button onclick="this.parentElement.remove()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0 4px">✕</button>';
  document.body.appendChild(banner);
}
async function installPWA(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted'){
    const b=document.getElementById('installBanner');
    if(b)b.remove();
  }
  deferredPrompt=null;
}
window.addEventListener('appinstalled',()=>{
  const b=document.getElementById('installBanner');
  if(b)b.remove();
  deferredPrompt=null;
});

// Service Worker 등록 (오프라인 사용 가능)
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='delivery-log-v1';
const ASSETS=[self.location.href];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const clone=res.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));return res;})));});
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
